name: Deploy CopperScreen website

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - '!docs/**/*.md'
      - scripts/build-website.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate gallery from manifest
        run: node scripts/build-website.mjs
      - name: Check gallery and JavaScript
        run: |
          node scripts/build-website.mjs --check
          node --check docs/gallery.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Wait for the Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..15}; do
            if artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts[] | select(.expired == false) | .id') && [[ -n "$artifact" ]]; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::The uploaded Pages artifact is still missing from the Actions API."
          exit 1
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
