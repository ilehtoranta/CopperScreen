name: CopperDisk release
run-name: CopperDisk ${{ inputs.version }} (${{ inputs.publish && 'publish' || 'validate' }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version matching CopperDisk.csproj
        required: true
        default: '3.0.0'
        type: string
      publish:
        description: Publish the validated package to NuGet.org
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: copperdisk-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate release version and branch
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'CopperDisk releases must run from main.'
          }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw 'A stable major.minor.patch version is required.'
          }
          $sourceVersion = dotnet msbuild CopperDisk/CopperDisk.csproj -getProperty:PackageVersion
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the package version.' }
          if ($sourceVersion.Trim() -cne $env:RELEASE_VERSION) {
            throw "Requested version must match source version $sourceVersion."
          }
      - name: Restore locked packages
        run: dotnet restore CopperScreen.slnx --locked-mode
      - name: Build production solution
        run: dotnet build CopperScreen.slnx -c Release --no-restore
      - name: Disk library tests
        run: dotnet test CopperDisk.Tests/CopperDisk.Tests.csproj -c Release --no-build --no-restore
      - name: Pack and validate CopperDisk
        run: >-
          dotnet pack CopperDisk/CopperDisk.csproj -c Release --no-restore
          -o artifacts/copperdisk-release
          -p:EnablePackageValidation=true
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryCommit=$env:GITHUB_SHA
      - name: Verify package identity and source commit
        run: |
          $packagePath = "artifacts/copperdisk-release/CopperDisk.$env:RELEASE_VERSION.nupkg"
          if (-not (Test-Path "artifacts/copperdisk-release/CopperDisk.$env:RELEASE_VERSION.snupkg")) {
            throw 'Symbol package is missing.'
          }
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $packagePath))
          try {
            $reader = [System.IO.StreamReader]::new($archive.GetEntry('CopperDisk.nuspec').Open())
            try { [xml] $manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($manifest.package.metadata.id -cne 'CopperDisk' -or
                $manifest.package.metadata.version -cne $env:RELEASE_VERSION -or
                $manifest.package.metadata.repository.commit -cne $env:GITHUB_SHA) {
              throw 'Package identity or source commit does not match this release.'
            }
          } finally { $archive.Dispose() }
      - uses: actions/upload-artifact@v4
        with:
          name: CopperDisk-${{ inputs.version }}-${{ github.sha }}
          path: artifacts/copperdisk-release/*.*nupkg
          if-no-files-found: error
          retention-days: 30

  publish:
    if: ${{ inputs.publish }}
    needs: package
    runs-on: windows-latest
    timeout-minutes: 10
    environment: nuget-copperdisk
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: CopperDisk-${{ inputs.version }}-${{ github.sha }}
          path: artifacts/copperdisk-release
      - name: NuGet trusted publishing login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ilehtoranta
      - name: Publish package and symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/copperdisk-release/CopperDisk.$env:RELEASE_VERSION.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --no-symbols --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw 'Package publication failed.' }
          dotnet nuget push "artifacts/copperdisk-release/CopperDisk.$env:RELEASE_VERSION.snupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw 'Symbol publication failed.' }
