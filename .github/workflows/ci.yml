name: CopperScreen CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msix-tool-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: MSIX identity, update and asset negative controls (no deployment)
        shell: pwsh
        run: ./scripts/tests/test-msix-tools.ps1
      - name: Release qualification identity and telemetry controls (no performance measurement)
        shell: pwsh
        run: ./scripts/tests/test-qualification-tools.ps1
      - name: Installed session duration and liveness controls (synthetic traces only)
        shell: pwsh
        run: ./scripts/tests/test-soak-tools.ps1

  replay-tool-tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay tooling negative controls (no ROM or game media)
        run: python -m unittest discover -s scripts/tests -p test_native_regression.py -v
      - name: AGA pixel checker controls (synthetic images only)
        run: python -m unittest discover -s scripts/tests -p 'test_aga*.py' -v

  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore locked packages
        run: dotnet restore CopperScreen.slnx --locked-mode
      - name: Build
        run: dotnet build CopperScreen.slnx -c Release --no-restore
      - name: Focused host tests (native ROM/media excluded)
        run: dotnet test CopperScreen.Lightweight.Tests/CopperScreen.Lightweight.Tests.csproj -c Release --no-build --no-restore
      - name: Desktop onboarding controls (separate UI process; native pair unavailable on CI)
        run: dotnet test CopperScreen.Desktop.Tests/CopperScreen.Desktop.Tests.csproj -c Release --no-build --no-restore
      - name: Disk library tests
        run: dotnet test CopperDisk.Tests/CopperDisk.Tests.csproj -c Release --no-build --no-restore
      - name: Runner smoke (synthetic, not a performance gate)
        run: dotnet run --project CopperMod.Amiga.Lightweight.Runner -c Release --no-build --no-restore -- --synthetic-rom-loop --frames 10

  engine-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore diagnostic tests separately
        run: dotnet restore CopperMod.Amiga.Lightweight.Tests/CopperMod.Amiga.Lightweight.Tests.csproj --locked-mode --artifacts-path artifacts/diagnostic-tests
      - name: Engine timing tests
        run: dotnet test CopperMod.Amiga.Lightweight.Tests/CopperMod.Amiga.Lightweight.Tests.csproj -c Release --no-restore --artifacts-path artifacts/diagnostic-tests

  native-desktop:
    name: Native desktop (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, rid: osx-arm64, arch: arm64 }
          - { runner: macos-15-intel, rid: osx-x64, arch: x86_64 }
          - { runner: ubuntu-24.04, rid: linux-x64, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, rid: linux-arm64, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      RID: ${{ matrix.rid }}
      NATIVE_ARCH: ${{ matrix.arch }}
      INCLUDE_MINI_ROM: ${{ github.repository == 'ilehtoranta/CopperScreen' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Set up Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libx11-6 libice6 libsm6 libfontconfig1 libgl1
      - name: Restore locked packages
        run: dotnet restore CopperScreen.slnx --locked-mode
      - name: Stage the qualified CopperStart Mini ROM and license
        if: env.INCLUDE_MINI_ROM == 'true'
        shell: pwsh
        env:
          MINI_01: ${{ secrets.COPPERSTART_MINI_BUNDLE_01 }}
          MINI_02: ${{ secrets.COPPERSTART_MINI_BUNDLE_02 }}
          MINI_03: ${{ secrets.COPPERSTART_MINI_BUNDLE_03 }}
          MINI_04: ${{ secrets.COPPERSTART_MINI_BUNDLE_04 }}
          MINI_05: ${{ secrets.COPPERSTART_MINI_BUNDLE_05 }}
          MINI_06: ${{ secrets.COPPERSTART_MINI_BUNDLE_06 }}
          MINI_07: ${{ secrets.COPPERSTART_MINI_BUNDLE_07 }}
          MINI_08: ${{ secrets.COPPERSTART_MINI_BUNDLE_08 }}
        run: |
          $parts = @($env:MINI_01, $env:MINI_02, $env:MINI_03, $env:MINI_04,
                     $env:MINI_05, $env:MINI_06, $env:MINI_07, $env:MINI_08)
          if ($parts -contains '' -or $parts -contains $null) {
              throw 'The CopperStart Mini bundle inputs are incomplete.'
          }
          $zip = Join-Path $env:RUNNER_TEMP 'copperstart-mini.zip'
          $inputs = Join-Path $env:RUNNER_TEMP 'copperstart-mini'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($parts -join ''))
          Expand-Archive -LiteralPath $zip -DestinationPath $inputs
          ./scripts/prepare-copperstart-mini-bundle.ps1 -Rom "$inputs/CopperStart-Mini.rom" -License "$inputs/LICENSE.txt"
      - name: Publish and package the desktop app
        shell: bash
        run: |
          test "$(uname -m)" = "$NATIVE_ARCH"
          project=CopperScreen/CopperScreen.csproj
          version="$(dotnet msbuild "$project" -getProperty:Version)"
          mkdir -p artifacts/native/package
          package="$PWD/artifacts/native/package"
          if [[ "$RID" == osx-* ]]; then
            app=CopperScreen.app
            output="$package/$app/Contents/MacOS"
            mkdir -p "$output"
            cat > "$package/$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>CopperScreen</string>
            <key>CFBundleIdentifier</key><string>org.copperscreen.CopperScreen</string>
            <key>CFBundleName</key><string>CopperScreen</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
            plutil -lint "$package/$app/Contents/Info.plist"
          else
            app=CopperScreen
            output="$package/$app"
          fi
          # Use a separate lock for the RID-specific runtime packs.
          dotnet publish "$project" -c Release -r "$RID" --self-contained true \
            -p:PublishTrimmed=false "-p:CopperScreenIncludeMiniRom=$INCLUDE_MINI_ROM" \
            -p:DebugType=None -p:DebugSymbols=false \
            "-p:NuGetLockFilePath=$package/../runtime.packages.lock.json" -o "$output"
          cp LICENSE THIRD-PARTY-NOTICES.md "$output/"
          archive="CopperScreen-$version-$RID.tar.gz"
          tar -czf "artifacts/native/$archive" -C "$package" "$app"
          (cd artifacts/native && shasum -a 256 "$archive" > "$archive.sha256")
          echo "NATIVE_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Smoke-test the extracted desktop package
        shell: bash
        run: |
          testdir="$(mktemp -d)"
          tar -xzf "artifacts/native/$NATIVE_ARCHIVE" -C "$testdir"
          smoke_args=(--desktop-smoke "$testdir/data")
          if [[ "$INCLUDE_MINI_ROM" == true ]]; then
            smoke_args+=(--boot-mini)
          fi
          if [[ "$RID" == osx-* ]]; then
            executable="$testdir/CopperScreen.app/Contents/MacOS/CopperScreen"
            launcher=()
          else
            executable="$testdir/CopperScreen/CopperScreen"
            launcher=(xvfb-run -a)
          fi
          if [[ "$INCLUDE_MINI_ROM" == true ]]; then
            test -s "$(dirname "$executable")/ROM/LICENSE.txt"
          fi
          "${launcher[@]}" "$executable" "${smoke_args[@]}" | tee "$testdir/desktop.log"
          if [[ "$INCLUDE_MINI_ROM" == true ]]; then
            grep -Fx 'CopperStart Mini boot smoke passed.' "$testdir/desktop.log"
          fi
          grep -Fx 'CopperScreen desktop smoke passed.' "$testdir/desktop.log"
      - name: Smoke-test the 68040 JIT on the native runner
        shell: bash
        run: |
          dotnet run --project CopperMod.Amiga.Lightweight.Runner -c Release --no-restore -- \
            --synthetic-rom-loop --frames 10 --cpu 68040 --jit | tee artifacts/native/jit-smoke.log
          grep -E 'JIT .*compiledInstructions=[1-9][0-9]*' artifacts/native/jit-smoke.log
          grep -E 'completed=10 .*unsupported=none' artifacts/native/jit-smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: CopperScreen-${{ matrix.rid }}
          path: |
            artifacts/native/*.tar.gz
            artifacts/native/*.sha256
          if-no-files-found: error
